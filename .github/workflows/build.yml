name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # +10 : les versions 1 à 3 ont été installées à la main.
      - name: Numéro de version
        run: echo "RECUL_VERSION_CODE=$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets de signature absents : pas de Release publiée."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/recul.jks"
          echo "RECUL_KEYSTORE=$RUNNER_TEMP/recul.jks" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        env:
          RECUL_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          RECUL_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RECUL_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Recul-0.1.${RECUL_VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Recul-0.1.${{ env.RECUL_VERSION_CODE }}
          path: Recul-*.apk

      - name: Publier la Release
        if: env.SIGNED == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${RECUL_VERSION_CODE}"
          NOTES="$(git log -1 --pretty=%s)"
          gh release create "$TAG" Recul-*.apk --title "Recul $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
